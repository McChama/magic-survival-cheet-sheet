name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # oxlint (see package.json's "lint" script). The project uses oxlint,
      # not ESLint, as its linter.
      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npx tsc -b
